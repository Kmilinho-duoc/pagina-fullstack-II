<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Pruebas de Contacto - Jasmine</title>

  <!-- Jasmine CSS & JS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jasmine/5.1.0/jasmine.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jasmine/5.1.0/jasmine.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jasmine/5.1.0/jasmine-html.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jasmine/5.1.0/boot0.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jasmine/5.1.0/boot1.js"></script>

  <!-- CAMBIO -->
  <script src="../js/contacto.js"></script>

  <!-- Archivo de pruebas (está en la misma carpeta testing) -->
  <script src="pasteleria.spec.js"></script>
</head>

<body>

  <!-- Formulario utilizado por las pruebas -->
  <div style="display: none;">

    <form id="formulario-contacto" novalidate>

      <!-- Nombre -->
      <input type="text" id="nombre">
      <div id="nombre-error"></div>

      <!-- Correo -->
      <input type="email" id="email">
      <div id="email-error"></div>

      <!-- Número telefónico -->
      <input type="tel" id="numerot">
      <div id="numerot-error"></div>

      <!-- Comentario -->
      <textarea id="comentario"></textarea>
      <div id="comentario-error"></div>

      <button type="submit">Enviar</button>

    </form>

  </div>

</body>
</html>
